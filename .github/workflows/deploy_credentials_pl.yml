name: 🔐 Deploy google_credentials_pl → VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Escrever google_credentials_pl.json no VPS
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configurar SSH para VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_PL }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 169.58.220.233 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Escrever google_credentials_pl.json no VPS
        env:
          GOOGLE_CREDENTIALS_PL: ${{ secrets.GOOGLE_CREDENTIALS_PL }}
        run: |
          echo "$GOOGLE_CREDENTIALS_PL" | ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 \
            "cat > /root/ao_vivo_pl/google_credentials_pl.json && chmod 600 /root/ao_vivo_pl/google_credentials_pl.json && echo '✅ google_credentials_pl.json escrito'"

      - name: Verificar arquivo
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 \
            "ls -lh /root/ao_vivo_pl/google_credentials_pl.json && python3 -c \"import json; d=json.load(open('/root/ao_vivo_pl/google_credentials_pl.json')); print('type:', d.get('type','?'), '| project:', d.get('project_id','?'))\""

      - name: Limpar chave SSH temporária
        if: always()
        run: rm -f ~/.ssh/vps_key
