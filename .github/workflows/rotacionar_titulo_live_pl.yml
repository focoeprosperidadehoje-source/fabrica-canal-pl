name: Rotacionar Título Live PL

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

jobs:
  rotacionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: pip install google-api-python-client google-auth google-auth-httplib2 pytz --quiet

      - name: Rotacionar título
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_PL }}
          TZ_NAME: Europe/Warsaw
          TITULOS_JSON: >-
            {"manha":"Matka Boża Uzdrawia Cię TERAZ — Modlitwa na Żywo 24H 🙏","tarde":"Matka Boża Otwiera Zamknięte Drzwi DZIŚ — Na Żywo 24H 🙏","noite":"Matka Boża Chroni Cię TERAZ — Modlitwa na Żywo 24H 🙏","madrugada":"Matka Boża Łamie Każde Jarzmo TERAZ — Na Żywo 24H 🙏"}
        run: python3 scripts/rotacionar_titulo_live.py
