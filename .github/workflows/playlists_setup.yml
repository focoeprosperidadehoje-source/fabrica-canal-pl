name: 5. Playlists das Novenas (PL)

on:
  schedule:
    - cron: '37 7 * * *' # diario, apos reset da cota (07:00 UTC)
    - cron: '7 13 * * *' # 2a passada: pega o 06:00 do ES/PT
  push:
    paths:
      - '.github/workflows/playlists_setup.yml'
      - 'playlists_setup.py'
  workflow_dispatch:

jobs:
  playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3'
      - run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 gspread google-genai pytz
      - env:
          CANAL: "PL"
          GOOGLE_CREDENTIALS_PL: ${{ secrets.GOOGLE_CREDENTIALS_PL }}
          YOUTUBE_TOKEN_PL: ${{ secrets.YOUTUBE_TOKEN_PL }}
        run: python playlists_setup.py
