name: Compilar Nowenny Kompletne (PL)

on:
  schedule:
    - cron: '10 8 * * 2'  # Wtorek 08:10 UTC (po resecie limitu o 08:00 UTC)
    - cron: '10 8 * * 5'  # Piątek  08:10 UTC
  workflow_dispatch:

jobs:
  compilar-pl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_PL }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_PL }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ffmpeg
          key: ffmpeg-static-linux64-n7

      - name: Install FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xf /tmp/ffmpeg.tar.xz --strip-components=2 -C /tmp --wildcards '*/bin/ffmpeg'
          sudo mv /tmp/ffmpeg /usr/local/bin/ffmpeg
          sudo chmod +x /usr/local/bin/ffmpeg

      - name: Install yt-dlp
        run: pip install --quiet yt-dlp

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            gspread \
            pytz

      - name: Check disk space
        run: df -h /tmp

      - name: Compile novenas PL
        run: python compilar_novena.py
